[workspace]
resolver = "3"
members = [ "crates/tacl", "crates/billing", "crates/documents", "crates/tagui", "crates/training", "crates/tui", "crates/db_commands", "crates/gui"]

[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
reliquary = {  git = "https://github.com/eupraxia05/reliquary.git", rev = "f1d9c7d", features = ["dolmen"] }
dolmen = {  git = "https://github.com/eupraxia05/dolmen.git", rev = "a1b6e1d" }

[patch.crates-io]
dolmen = {git = "https://github.com/eupraxia05/dolmen.git", rev = "a1b6e1d" }
reliquary = { git = "https://github.com/eupraxia05/reliquary.git", rev = "f1d9c7d" }

[workspace.lints.rust]
missing_docs = "allow"

[workspace.lints.rustdoc]
missing_crate_level_docs = "allow"
